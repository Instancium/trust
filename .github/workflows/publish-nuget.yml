name: Publish NuGet Packages

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Instancium.Trust.slnx

      - name: Run unit tests
        run: dotnet test tests/Instancium.Trust.Tests/Instancium.Trust.Tests.csproj -c Release --no-restore

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Instancian

      - name: Pack Instancium.Trust
        run: dotnet pack src/Instancium.Trust/Instancium.Trust.csproj -c Release --no-restore -o ./nupkg

      - name: Push Instancium.Trust to NuGet
        run: dotnet nuget push ./nupkg/Instancium.Trust.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate